<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFimix | Profile</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 { margin: 10px 0 5px 0; color: #fff; }
        p.subtitle { color: #8b949e; margin-bottom: 20px; }

        .section {
            text-align: left;
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 1rem;
            color: var(--accent);
            margin-top: 0;
        }

        .links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn {
            display: block;
            padding: 12px;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .link-btn:hover {
            border-color: var(--accent);
            background: #21262d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace avatar.jpg with your picture URL -->
        <img src="https://via.placeholder.com/120" alt="Avatar" class="avatar">
        <h1>MFimix</h1>
        <p class="subtitle">Tech Enthusiast & Gamer</p>

        <div class="section">
            <h2>About Me</h2>
            <p>Welcome to my custom landing page. Custom dotfiles, gaming gear, and tech setups.</p>
        </div>

        <div class="section">
            <h2>System Specs</h2>
            <ul>
                <li><strong>CPU:</strong> AMD Ryzen 7 7700</li>
                <li><strong>GPU:</strong> NVIDIA RTX 5060 Ti 16GB</li>
                <li><strong>RAM:</strong> 32GB DDR5 6000MHz</li>
            </ul>
        </div>

        <div class="links">
            <a href="https://steamcommunity.com" class="link-btn" target="_blank">Steam Profile</a>
            <a href="https://github.com" class="link-btn" target="_blank">GitHub Projects</a>
        </div>
    </div>

</body>
</html>
